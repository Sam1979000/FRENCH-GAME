<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les contraires</title>
<style>
  :root {
    --bg1: #fff7d6;
    --bg2: #d9f2ff;
    --ink: #2b2d42;
    --card: #ffffff;
    --accent: #ff7a00;
    --ok: #2ecc71;
    --bad: #e63946;
    --select: #3a86ff;
    --gap: clamp(8px, 1.6vmin, 18px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    display: flex;
    flex-direction: column;
    min-height: 100%;
    padding: max(10px, env(safe-area-inset-top)) 16px max(10px, env(safe-area-inset-bottom));
    user-select: none;
    -webkit-user-select: none;
  }
  header { text-align: center; }
  h1 {
    margin: 0;
    font-size: clamp(28px, 6vmin, 64px);
    letter-spacing: 1px;
  }
  h1 span:nth-child(7n+1) { color: #e63946; }
  h1 span:nth-child(7n+2) { color: #3a86ff; }
  h1 span:nth-child(7n+3) { color: #f4a300; }
  h1 span:nth-child(7n+4) { color: #2a9d4b; }
  h1 span:nth-child(7n+5) { color: #ff7a00; }
  h1 span:nth-child(7n+6) { color: #ff5fa2; }
  h1 span:nth-child(7n+7) { color: #8e44ad; }

  button {
    font: inherit;
    color: inherit;
    border: none;
    cursor: pointer;
    touch-action: manipulation;
  }

  .tabs {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 6px 0 4px;
    flex-wrap: wrap;
  }
  .tab {
    font-size: clamp(18px, 3.2vmin, 32px);
    font-weight: bold;
    background: var(--card);
    padding: 6px 20px;
    border-radius: 999px;
    box-shadow: 0 4px 0 rgba(0,0,0,.1);
  }
  .tab.active { background: var(--select); color: #fff; box-shadow: 0 4px 0 #2560c4; }

  .instructions {
    margin: 6px auto 10px;
    font-size: clamp(16px, 3vmin, 32px);
    font-weight: bold;
    background: var(--card);
    display: inline-block;
    padding: 6px 18px;
    border-radius: 999px;
    box-shadow: 0 3px 0 rgba(0,0,0,.08);
  }

  .mode { display: none; flex: 1; flex-direction: column; }
  .mode.active { display: flex; }

  /* ---------- Relier (match) ---------- */
  .board {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: calc(var(--gap) * 2);
    width: 100%;
    max-width: 1800px;
    margin: 0 auto;
  }
  .panel {
    background: rgba(255,255,255,.55);
    border-radius: 24px;
    padding: var(--gap);
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto;
    grid-auto-rows: 1fr;
    gap: var(--gap);
  }
  .panel h2 {
    margin: 0;
    text-align: center;
    font-size: clamp(16px, 2.8vmin, 30px);
    grid-column: 1 / -1;
  }
  @media (min-aspect-ratio: 4/3) {
    .panel { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  .item {
    position: relative;
    border-radius: 20px;
    background: var(--card);
    min-height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .35em;
    padding: 4px 8px;
    box-shadow: 0 5px 0 rgba(0,0,0,.12);
    transition: transform .12s, box-shadow .12s, opacity .3s;
    font-size: clamp(18px, 3.6vmin, 44px);
    font-weight: bold;
  }
  #left .item { color: #3a86ff; }
  #right .item { color: #d6336c; }
  .item:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.12); }
  .item.selected {
    outline: 6px solid var(--select);
    outline-offset: 2px;
    transform: scale(1.05);
  }
  .item.matched {
    opacity: .5;
    pointer-events: none;
    box-shadow: none;
  }
  .item.matched::after {
    content: "✓";
    position: absolute;
    top: 2px; right: 8px;
    color: var(--ok);
    font-size: clamp(18px, 3vmin, 34px);
  }
  .item.wrong { animation: shake .4s; }
  .item.pop { animation: pop .45s; }
  .emoji { font-size: .9em; }

  /* ---------- Écrire (write) ---------- */
  .card {
    margin: 0 auto;
    width: 100%;
    max-width: 760px;
    background: var(--card);
    border-radius: 28px;
    padding: clamp(14px, 3vmin, 32px);
    box-shadow: 0 8px 0 rgba(0,0,0,.08);
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: clamp(10px, 2vmin, 20px);
  }
  .progress { font-size: clamp(16px, 2.6vmin, 26px); font-weight: bold; color: #666; }
  .dots { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .dots span {
    width: 18px; height: 18px; border-radius: 50%;
    background: #e5e5e5;
  }
  .dots span.ok { background: var(--ok); }
  .dots span.no { background: var(--bad); }
  .dots span.now { outline: 3px solid var(--select); outline-offset: 2px; }
  .question {
    font-size: clamp(34px, 9vmin, 96px);
    font-weight: bold;
    color: #3a86ff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .3em;
    flex-wrap: wrap;
  }
  .speak {
    font-size: clamp(22px, 4vmin, 40px);
    background: #eef4ff;
    border-radius: 50%;
    width: 1.8em; height: 1.8em;
  }
  .label { font-size: clamp(18px, 3vmin, 30px); font-weight: bold; }
  #answer {
    font: inherit;
    font-size: clamp(28px, 6vmin, 64px);
    font-weight: bold;
    color: #d6336c;
    text-align: center;
    width: 100%;
    padding: .2em .4em;
    border: 4px solid #cfd8e3;
    border-radius: 18px;
    outline: none;
    user-select: text;
    -webkit-user-select: text;
  }
  #answer:focus { border-color: var(--select); }
  #answer.good { border-color: var(--ok); background: #eafaf1; }
  #answer.bad { border-color: var(--bad); background: #fdecee; animation: shake .4s; }
  .accents { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .accents button {
    font-size: clamp(22px, 4vmin, 40px);
    font-weight: bold;
    min-width: 2em;
    padding: .1em .4em;
    background: #fff4e0;
    border-radius: 14px;
    box-shadow: 0 4px 0 rgba(0,0,0,.1);
  }
  .accents button:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.1); }
  .feedback {
    min-height: 1.4em;
    font-size: clamp(18px, 3.4vmin, 36px);
    font-weight: bold;
  }
  .feedback.good { color: #1e9c55; }
  .feedback.bad { color: var(--bad); }
  .actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .big {
    font-size: clamp(22px, 4.4vmin, 44px);
    font-weight: bold;
    color: #fff;
    padding: .35em 1.1em;
    border-radius: 999px;
  }
  #check { background: var(--ok); box-shadow: 0 6px 0 #1e9c55; }
  #next { background: var(--select); box-shadow: 0 6px 0 #2560c4; }
  .big:active { transform: translateY(3px); }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(10px); }
    60% { transform: translateX(-7px); }
    80% { transform: translateX(7px); }
  }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  /* ---------- Bravo screen ---------- */
  #bravo {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
    background: rgba(255, 247, 214, .94);
    z-index: 10;
    text-align: center;
    padding: 16px;
    overflow-y: auto;
  }
  #bravo.show { display: flex; }
  #bravo h2 {
    margin: 0;
    font-size: clamp(56px, 16vmin, 180px);
    color: var(--accent);
    text-shadow: 0 6px 0 rgba(0,0,0,.1);
    animation: pop .8s infinite;
  }
  .stars { font-size: clamp(40px, 10vmin, 110px); }
  #score { font-size: clamp(22px, 5vmin, 54px); font-weight: bold; }
  #review {
    font-size: clamp(16px, 2.6vmin, 26px);
    background: #fff;
    border-radius: 18px;
    padding: 10px 18px;
    display: none;
    text-align: left;
  }
  #review div { margin: 2px 0; }
  #replay {
    font-size: clamp(28px, 6vmin, 64px);
    font-weight: bold;
    background: var(--ok);
    color: #fff;
    padding: .4em 1.2em;
    border-radius: 999px;
    box-shadow: 0 8px 0 #1e9c55;
  }
  #replay:active { transform: translateY(4px); box-shadow: 0 4px 0 #1e9c55; }

  .confetti {
    position: fixed;
    top: -20px;
    width: 14px;
    height: 20px;
    border-radius: 3px;
    z-index: 11;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    #bravo h2, .item.wrong, .item.pop, #answer.bad { animation: none; }
    .confetti { display: none; }
  }
</style>
</head>
<body>
  <header>
    <h1><span>L</span><span>e</span><span>s</span> <span>c</span><span>o</span><span>n</span><span>t</span><span>r</span><span>a</span><span>i</span><span>r</span><span>e</span><span>s</span></h1>
    <div class="tabs">
      <button class="tab active" data-mode="match">🔗 Relie</button>
      <button class="tab" data-mode="write">✏️ Écris</button>
    </div>
  </header>

  <section class="mode active" id="mode-match">
    <div style="text-align:center"><div class="instructions">👆 Touche un mot, puis son contraire.</div></div>
    <div class="board">
      <section class="panel" id="left" aria-label="Mots"></section>
      <section class="panel" id="right" aria-label="Contraires"></section>
    </div>
  </section>

  <section class="mode" id="mode-write">
    <div style="text-align:center"><div class="instructions">✏️ Écris le contraire.</div></div>
    <div class="card">
      <div class="progress" id="progress"></div>
      <div class="dots" id="dots"></div>
      <div class="question">
        <span id="q-word"></span>
        <button class="speak" id="speak" aria-label="Écouter">🔊</button>
      </div>
      <div class="label">⬇️ le contraire :</div>
      <input id="answer" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" lang="fr">
      <div class="accents" id="accents"></div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="actions">
        <button class="big" id="check">✔ Vérifier</button>
        <button class="big" id="next">Suivant ➜</button>
      </div>
    </div>
  </section>

  <div id="bravo" role="dialog" aria-live="polite">
    <div class="stars">⭐🌈⭐</div>
    <h2>Bravo !</h2>
    <div id="score"></div>
    <div id="review"></div>
    <button id="replay">🔄 Rejouer</button>
  </div>

<script>
  // "answer" is shown and spoken; "accept" lists every spelling counted as right in the writing game.
  const PAIRS = [
    { word: "haut",   wEmoji: "⬆️", answer: "bas",      aEmoji: "⬇️", accept: ["bas"] },
    { word: "lourde", wEmoji: "🏋️", answer: "légère",   aEmoji: "🪶", accept: ["légère"] },
    { word: "madame", wEmoji: "👩", answer: "monsieur", aEmoji: "👨", accept: ["monsieur"] },
    { word: "fille",  wEmoji: "👧", answer: "garçon",   aEmoji: "👦", accept: ["garçon"] },
    { word: "grande", wEmoji: "🦒", answer: "petite",   aEmoji: "🐭", accept: ["petite"] },
    { word: "épais",  wEmoji: "📚", answer: "mince",    aEmoji: "📄", accept: ["mince", "fin"] },
    { word: "grosse", wEmoji: "🐘", answer: "maigre",   aEmoji: "🦩", accept: ["maigre", "mince"] },
    { word: "large",  wEmoji: "🛣️", answer: "étroit",   aEmoji: "🚪", accept: ["étroit", "étroite"] },
    { word: "longue", wEmoji: "🐍", answer: "courte",   aEmoji: "🐛", accept: ["courte"] },
    { word: "beau",   wEmoji: "🦚", answer: "laid",     aEmoji: "👹", accept: ["laid", "moche"] },
  ];

  const bravoEl = document.getElementById("bravo");
  let mode = "match";

  // ---------- Speech ----------
  let frVoice = null;
  function pickVoice() {
    if (!("speechSynthesis" in window)) return;
    const voices = speechSynthesis.getVoices();
    frVoice = voices.find(v => v.lang === "fr-FR")
           || voices.find(v => v.lang && v.lang.toLowerCase().startsWith("fr"))
           || null;
  }
  if ("speechSynthesis" in window) {
    pickVoice();
    speechSynthesis.onvoiceschanged = pickVoice;
  }
  function say(text) {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "fr-FR";
    if (frVoice) u.voice = frVoice;
    u.rate = 0.85;
    speechSynthesis.speak(u);
  }

  // ---------- Sounds ----------
  let audioCtx = null;
  function tone(freq, start, dur, type = "sine", vol = 0.2) {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime + start;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  }
  function playSound(kind) {
    try {
      if (kind === "match") {
        tone(660, 0, 0.15); tone(880, 0.1, 0.25);
      } else if (kind === "wrong") {
        tone(220, 0, 0.25, "triangle", 0.15);
      } else if (kind === "win") {
        [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i * 0.13, 0.3, "triangle", 0.25));
      }
    } catch (e) { /* audio not available */ }
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ---------- Relie (match) ----------
  const leftEl = document.getElementById("left");
  const rightEl = document.getElementById("right");
  let selected = null;
  let matchedCount = 0;

  function makeItem(text, emoji, key, side) {
    const b = document.createElement("button");
    b.className = "item";
    b.dataset.key = key;
    b.dataset.side = side;
    const e = document.createElement("span");
    e.className = "emoji";
    e.textContent = emoji;
    const t = document.createElement("span");
    t.textContent = text;
    b.append(e, t);
    b.addEventListener("click", () => { say(text); choose(b); });
    return b;
  }

  function buildMatch() {
    leftEl.innerHTML = "<h2>Le mot</h2>";
    rightEl.innerHTML = "<h2>Le contraire</h2>";
    selected = null;
    matchedCount = 0;
    shuffle(PAIRS).forEach(p => leftEl.appendChild(makeItem(p.word, p.wEmoji, p.word, "left")));
    shuffle(PAIRS).forEach(p => rightEl.appendChild(makeItem(p.answer, p.aEmoji, p.word, "right")));
  }

  function choose(btn) {
    if (!selected || selected.dataset.side === btn.dataset.side) {
      if (selected) selected.classList.remove("selected");
      selected = btn;
      btn.classList.add("selected");
      return;
    }

    const other = selected;
    other.classList.remove("selected");
    selected = null;

    if (other.dataset.key === btn.dataset.key) {
      [other, btn].forEach(el => {
        el.classList.add("matched", "pop");
        el.setAttribute("aria-disabled", "true");
      });
      playSound("match");
      matchedCount++;
      if (matchedCount === PAIRS.length) setTimeout(() => win(null), 700);
    } else {
      playSound("wrong");
      [other, btn].forEach(el => {
        el.classList.remove("wrong");
        void el.offsetWidth; // restart animation
        el.classList.add("wrong");
      });
    }
  }

  // ---------- Écris (write) ----------
  const qWord = document.getElementById("q-word");
  const answerEl = document.getElementById("answer");
  const feedbackEl = document.getElementById("feedback");
  const progressEl = document.getElementById("progress");
  const dotsEl = document.getElementById("dots");
  const checkBtn = document.getElementById("check");
  const nextBtn = document.getElementById("next");

  let order = [];
  let index = 0;
  let tries = 0;
  let results = [];   // true = right, false = wrong, per question in order

  ["é", "è", "ê", "à", "ç", "ô"].forEach(ch => {
    const b = document.createElement("button");
    b.textContent = ch;
    b.addEventListener("click", () => {
      if (answerEl.disabled) return;
      const s = answerEl.selectionStart ?? answerEl.value.length;
      const e = answerEl.selectionEnd ?? answerEl.value.length;
      answerEl.value = answerEl.value.slice(0, s) + ch + answerEl.value.slice(e);
      answerEl.focus();
      answerEl.setSelectionRange(s + 1, s + 1);
    });
    document.getElementById("accents").appendChild(b);
  });

  const clean = s => s.trim().toLowerCase().replace(/\s+/g, " ").replace(/’/g, "'");
  const noAccents = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "");

  function buildWrite() {
    order = shuffle(PAIRS);
    index = 0;
    results = [];
    showQuestion();
  }

  function renderDots() {
    dotsEl.innerHTML = "";
    order.forEach((_, i) => {
      const d = document.createElement("span");
      if (i < results.length) d.className = results[i] ? "ok" : "no";
      else if (i === index) d.className = "now";
      dotsEl.appendChild(d);
    });
  }

  function showQuestion() {
    const p = order[index];
    tries = 0;
    qWord.textContent = p.wEmoji + " " + p.word;
    progressEl.textContent = `${index + 1} / ${order.length}`;
    answerEl.value = "";
    answerEl.className = "";
    answerEl.disabled = false;
    feedbackEl.textContent = "";
    feedbackEl.className = "feedback";
    checkBtn.style.display = "";
    nextBtn.style.display = "none";
    renderDots();
    if (mode === "write") answerEl.focus();
  }

  function check() {
    const p = order[index];
    const typed = clean(answerEl.value);
    if (!typed) { answerEl.focus(); return; }

    const exact = p.accept.includes(typed);
    const almost = !exact && p.accept.some(a => noAccents(a) === noAccents(typed));

    if (exact || almost) {
      results.push(true);
      answerEl.className = "good";
      feedbackEl.className = "feedback good";
      feedbackEl.textContent = exact
        ? `✅ Très bien ! ${p.word} ↔ ${typed}`
        : `✅ Oui ! Attention aux accents : ${p.accept.find(a => noAccents(a) === noAccents(typed))}`;
      playSound("match");
      say(p.word + " ... " + (exact ? typed : p.answer));
      finishQuestion();
    } else {
      tries++;
      answerEl.classList.remove("bad");
      void answerEl.offsetWidth;
      answerEl.className = "bad";
      playSound("wrong");
      feedbackEl.className = "feedback bad";
      if (tries < 2) {
        feedbackEl.textContent = `❌ Essaie encore ! Indice : ${p.aEmoji} ${p.answer[0]}…`;
        answerEl.focus();
      } else {
        results.push(false);
        feedbackEl.textContent = `La réponse : ${p.aEmoji} ${p.answer}`;
        say(p.word + " ... " + p.answer);
        finishQuestion();
      }
    }
  }

  function finishQuestion() {
    answerEl.disabled = true;
    checkBtn.style.display = "none";
    nextBtn.style.display = "";
    nextBtn.focus();
    renderDots();
  }

  function next() {
    index++;
    if (index >= order.length) {
      renderDots();
      const score = results.filter(Boolean).length;
      setTimeout(() => win(score), 300);
    } else {
      showQuestion();
    }
  }

  checkBtn.addEventListener("click", check);
  nextBtn.addEventListener("click", next);
  answerEl.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    e.preventDefault(); // stop the same Enter from also pressing "Suivant" once it gets focus
    check();
  });
  document.getElementById("speak").addEventListener("click", () => say(order[index].word));

  // ---------- Bravo ----------
  const scoreEl = document.getElementById("score");
  const reviewEl = document.getElementById("review");

  function win(score) {
    if (score === null) {
      scoreEl.textContent = "";
      reviewEl.style.display = "none";
    } else {
      scoreEl.textContent = `${score} / ${order.length}`;
      reviewEl.innerHTML = "";
      order.forEach((p, i) => {
        const d = document.createElement("div");
        d.textContent = `${results[i] ? "✅" : "❌"} ${p.word} ↔ ${p.answer}`;
        reviewEl.appendChild(d);
      });
      reviewEl.style.display = "block";
    }
    bravoEl.classList.add("show");
    playSound("win");
    setTimeout(() => say("Bravo !"), 600);
    confetti();
  }

  function confetti() {
    const colours = ["#e63946", "#1e6fff", "#ffd60a", "#2a9d4b", "#ff7a00", "#ff8fc7", "#8e44ad"];
    for (let i = 0; i < 80; i++) {
      const p = document.createElement("div");
      p.className = "confetti";
      p.style.left = Math.random() * 100 + "vw";
      p.style.background = colours[i % colours.length];
      p.style.animationDuration = 2 + Math.random() * 2 + "s";
      p.style.animationDelay = Math.random() * 0.8 + "s";
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 5000);
    }
  }

  document.getElementById("replay").addEventListener("click", () => {
    bravoEl.classList.remove("show");
    document.querySelectorAll(".confetti").forEach(p => p.remove());
    if (mode === "match") buildMatch(); else buildWrite();
  });

  // ---------- Tabs ----------
  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      mode = tab.dataset.mode;
      document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === tab));
      document.getElementById("mode-match").classList.toggle("active", mode === "match");
      document.getElementById("mode-write").classList.toggle("active", mode === "write");
      if (mode === "match") buildMatch(); else buildWrite();
    });
  });

  buildMatch();
  buildWrite();
</script>
</body>
</html>
